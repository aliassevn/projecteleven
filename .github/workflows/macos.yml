name: macOS

# Builds Cyberpad for the Mac (Apple silicon and Intel) and the installer (Cyberpad-<version>.dmg).
# - On every push to main that touches macos/ or shared/: build only (the dmg is an artifact of the run).
# - On a tag macos-v<version> (e.g. macos-v0.1.0): build and publish a Release with the dmg on GitHub.

on:
  push:
    branches: [main]
    paths: ['macos/**', 'shared/**', '.github/workflows/macos.yml']
    tags: ['macos-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: v
        run: |
          v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Resources/Info.plist)
          if [[ "$GITHUB_REF" == refs/tags/macos-v* ]]; then v="${GITHUB_REF_NAME#macos-v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build Cyberpad.app and dmg (universal)
        env:
          CYBERPAD_BUILD: ${{ github.run_number }}
        run: macos/scripts/make-dmg.sh "${{ steps.v.outputs.version }}" universal

      - name: Check
        run: |
          lipo -archs macos/build/Cyberpad.app/Contents/MacOS/Cyberpad
          for f in pad/index.html editor/index.html themes/cyberdeck.json i18n/en.json catalog/shortcuts.json; do
            test -e "macos/build/Cyberpad.app/Contents/Resources/$f" || { echo "Missing: $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Cyberpad-${{ steps.v.outputs.version }}-mac
          path: macos/build/Cyberpad-*.dmg

      - name: Release on GitHub
        if: startsWith(github.ref, 'refs/tags/macos-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" macos/build/Cyberpad-*.dmg \
            --title "Cyberpad for Mac ${{ steps.v.outputs.version }}" --notes-file macos/RELEASE_NOTES.md --prerelease
