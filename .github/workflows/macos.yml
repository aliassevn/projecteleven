name: macOS

# Bouwt Cyberpad voor de Mac (Apple-chip én Intel) en de installer (Cyberpad-<versie>.dmg).
# - Bij elke push naar main die macos/ of shared/ raakt: alleen bouwen (dmg als artifact bij de run).
# - Bij een tag macos-v<versie> (bijv. macos-v0.1.0): bouwen én een Release met de dmg op GitHub zetten.

on:
  push:
    branches: [main]
    paths: ['macos/**', 'shared/**', '.github/workflows/macos.yml']
    tags: ['macos-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versie bepalen
        id: v
        run: |
          v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Resources/Info.plist)
          if [[ "$GITHUB_REF" == refs/tags/macos-v* ]]; then v="${GITHUB_REF_NAME#macos-v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cyberpad.app en dmg bouwen (universeel)
        env:
          CYBERPAD_BUILD: ${{ github.run_number }}
        run: macos/scripts/make-dmg.sh "${{ steps.v.outputs.version }}" universal

      - name: Controleren
        run: |
          lipo -archs macos/build/Cyberpad.app/Contents/MacOS/Cyberpad
          for f in pad/index.html editor/index.html themes/cyberdeck.json i18n/en.json catalog/shortcuts.json; do
            test -e "macos/build/Cyberpad.app/Contents/Resources/$f" || { echo "Ontbreekt: $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Cyberpad-${{ steps.v.outputs.version }}-mac
          path: macos/build/Cyberpad-*.dmg

      - name: Release op GitHub
        if: startsWith(github.ref, 'refs/tags/macos-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" macos/build/Cyberpad-*.dmg \
            --title "Cyberpad voor Mac ${{ steps.v.outputs.version }}" --notes-file macos/RELEASE_NOTES.md --prerelease
