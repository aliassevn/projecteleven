<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060a">
<title>Cyberpad — Layout bewerken</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
  <div id="top" class="top">
    <span class="brand">CYBERPAD <span class="dim">// EDITOR</span></span>
    <span class="spacer"></span>
    <span id="problems" class="problems"></span>
    <button id="b-undo" class="btn" title="Ongedaan maken">↶</button>
    <button id="b-redo" class="btn" title="Opnieuw">↷</button>
    <button id="b-add" class="btn add">+ TOEVOEGEN</button>
    <button id="b-theme" class="btn">THEMA</button>
    <button id="b-profiles" class="btn">PROFIELEN</button>
    <button id="b-export" class="btn">EXPORTEREN</button>
    <button id="b-import" class="btn">IMPORTEREN</button>
    <input id="f-import" type="file" accept=".cyberpad,.json,application/json" class="hidden">
    <input id="f-icon" type="file" accept="image/*" class="hidden">
    <button id="b-save" class="btn primary">OPSLAAN</button>
    <a id="b-back" class="btn hidden" href="/">TERUG</a>
  </div>

  <div id="pages" class="pages"></div>

  <div id="main" class="main">
    <div id="canvas" class="canvas"><div id="grid" class="grid"></div></div>
    <div id="side" class="side"></div>
  </div>

  <div id="msg" class="msg hidden"></div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><span id="modal-title" class="modal-title"></span><span id="modal-close" class="link">SLUITEN ✕</span></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="gate" class="gate hidden">
    <div class="gate-box">
      <div class="modal-title">// LAYOUT BEWERKEN</div>
      <p id="gate-text"></p>
      <button id="gate-btn" class="btn primary hidden">TOESTEMMING VRAGEN</button>
      <p><a href="/" class="link">← terug naar de knoppen</a></p>
    </div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
