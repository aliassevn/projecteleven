<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060a">
<title>Cyberpad</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
  <div id="top" class="top">
    <button id="b-close" class="btn close hidden" title="Terug naar de knoppen" data-t-title>✕ <span data-t>SLUITEN</span></button>
    <span class="brand">CYBERPAD <span class="dim">// EDITOR</span></span>
    <span class="spacer"></span>
    <span id="problems" class="problems"></span>
    <button id="b-undo" class="btn" title="Ongedaan maken" data-t-title>↶</button>
    <button id="b-redo" class="btn" title="Opnieuw" data-t-title>↷</button>
    <button id="b-add" class="btn add">+ <span data-t>TOEVOEGEN</span></button>
    <button id="b-theme" class="btn" data-t>THEMA</button>
    <button id="b-profiles" class="btn" data-t>PROFIELEN</button>
    <span class="more-wrap">
      <button id="b-more" class="btn"><span data-t>MEER</span> ▾</button>
      <span id="more-menu" class="more-menu hidden">
        <span id="b-export" class="more-item" data-t>Exporteren (.cyberpad)</span>
        <span id="b-import" class="more-item" data-t>Importeren…</span>
        <span id="more-lang" class="more-lang"></span>
      </span>
    </span>
    <input id="f-import" type="file" accept=".cyberpad,.json,application/json" class="hidden">
    <input id="f-icon" type="file" accept="image/*" class="hidden">
    <button id="b-save" class="btn primary" data-t>OPSLAAN</button>
  </div>

  <div id="pages" class="pages"></div>

  <div id="preview" class="preview-bar"></div>

  <div id="main" class="main">
    <div id="canvas" class="canvas"><div id="grid" class="grid"></div></div>
    <div id="side" class="side"></div>
  </div>

  <div id="msg" class="msg hidden"></div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><span id="modal-title" class="modal-title"></span><span id="modal-close" class="link" data-t>SLUITEN ✕</span></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="gate" class="gate hidden">
    <div class="gate-box">
      <div class="modal-title">// <span data-t>LAYOUT BEWERKEN</span></div>
      <p id="gate-text"></p>
      <button id="gate-btn" class="btn primary hidden"></button>
      <p><a href="/" class="link">← <span data-t>terug naar de knoppen</span></a></p>
    </div>
  </div>

  <script src="/i18n.js"></script>
  <script src="editor.js"></script>
</body>
</html>
