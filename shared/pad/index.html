<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cyberpad">
<meta name="theme-color" content="#05060a">
<title>Cyberpad</title>
<link rel="stylesheet" href="pad.css">
</head>
<body>
  <div id="status" class="status">
    <span class="brand">CYBERPAD</span>
    <span id="profile-name" class="profile-name"></span>
    <span id="meeting-pill" class="meeting-pill hidden">● VERGADERING</span>
    <span id="status-text" class="status-text">VERBINDEN…</span>
    <span id="status-dot" class="dot"></span>
  </div>

  <div id="pad" class="pad"></div>
  <div id="tabs" class="tabs"></div>

  <div id="meeting" class="meeting hidden">
    <div class="meeting-head">
      <span id="meeting-title" class="meeting-title">// VERGADERING</span>
      <span id="meeting-since" class="meeting-since"></span>
      <span id="meeting-hide" class="meeting-hide">VERBERGEN ✕</span>
    </div>
    <div id="meeting-grid" class="meeting-grid"></div>
    <div id="meeting-note" class="meeting-note"></div>
  </div>

  <div id="pair" class="pair hidden">
    <div class="pair-box">
      <div class="pair-title">// KOPPELEN</div>
      <p class="pair-help">Voer de 6-cijferige code in die in de menubalk van je Mac staat.</p>
      <input id="pair-code" class="pair-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="000000">
      <button id="pair-btn" class="pair-btn">KOPPEL</button>
      <p id="pair-msg" class="pair-msg"></p>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div class="scanlines"></div>

  <script src="pad.js"></script>
</body>
</html>
