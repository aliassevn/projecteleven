<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cyberpad">
<meta name="theme-color" content="#05060a">
<title>Cyberpad</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link id="theme-css" rel="stylesheet" href="pad.css">
</head>
<body>
  <div id="status" class="status">
    <span class="brand">CYBERPAD</span>
    <span id="profile-name" class="profile-name"></span>
    <span id="meeting-pill" class="meeting-pill hidden">● <span data-t>VERGADERING</span></span>
    <span id="status-text" class="status-text" data-t>VERBINDEN…</span>
    <span id="status-dot" class="dot"></span>
    <span id="fs-toggle" class="fs-toggle hidden" title="Schermvullend" data-t-title>⛶</span>
    <span id="settings-open" class="settings-open">⚙</span>
  </div>

  <div id="offline" class="offline-bar hidden">
    <span class="offline-text" data-t>VERBINDING MET DE MAC WEG</span>
    <span id="offline-retry" class="offline-retry" data-t>NU PROBEREN</span>
  </div>

  <div id="pad" class="pad"></div>
  <div id="tabs" class="tabs"></div>

  <div id="meeting" class="meeting hidden">
    <div class="meeting-head">
      <span id="meeting-title" class="meeting-title">// <span data-t>VERGADERING</span></span>
      <span id="meeting-since" class="meeting-since"></span>
      <span id="meeting-hide" class="meeting-hide" data-t>VERBERGEN ✕</span>
    </div>
    <div id="meeting-grid" class="meeting-grid"></div>
    <div id="meeting-note" class="meeting-note"></div>
  </div>

  <div id="pair" class="pair hidden">
    <div class="pair-box">
      <div class="pair-title">// <span data-t>KOPPELEN</span></div>
      <p class="pair-help" data-t>Voer de 6-cijferige code in die in de menubalk van je Mac staat.</p>
      <input id="pair-code" class="pair-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="000000">
      <button id="pair-btn" class="pair-btn" data-t>KOPPEL</button>
      <p id="pair-msg" class="pair-msg"></p>
    </div>
  </div>

  <div id="settings" class="settings hidden">
    <div class="settings-box">
      <div class="settings-head">
        <span class="pair-title">// <span data-t>INSTELLINGEN</span></span>
        <span id="settings-close" class="meeting-hide" data-t>SLUITEN ✕</span>
      </div>
      <div id="settings-rows"></div>
      <p id="settings-home" class="settings-note"></p>
      <span id="settings-edit" class="set-opt" data-t>LAYOUT BEWERKEN ›</span>
      <span id="settings-forget" class="set-opt danger" data-t>DEZE TABLET ONTKOPPELEN</span>
    </div>
  </div>

  <div id="ambient" class="ambient hidden">
    <div id="amb-photo" class="amb-photo"></div>
    <div id="amb-box" class="amb-box">
      <div id="amb-time" class="amb-time">--:--</div>
      <div id="amb-date" class="amb-date"></div>
      <div id="amb-info" class="amb-info"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div class="scanlines"></div>

  <script src="i18n.js"></script>
  <script src="pad.js"></script>
</body>
</html>
